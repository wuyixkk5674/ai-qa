name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Start API Server in background
        run: |
          # 1. 后台启动服务，并将日志重定向到文件中，避免阻塞 CI
          npm start > /tmp/api-server.log 2>&1 &

          # 2. 循环检测端口是否就绪 (最多等 30 秒)
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3000 > /dev/null; then
              echo "Server is up after ${i} seconds!"
              exit 0
            fi
            sleep 1
          done

          # 3. 如果超时，打印服务日志并强制让 CI 失败
          echo "Server failed to start in time. Printing logs:"
          cat /tmp/api-server.log
          exit 1

      - name: Unit test
        run: npm test